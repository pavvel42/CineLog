name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest tests/ -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Type-check backend (mypy)
        run: python -m mypy

      - name: Lint (pyflakes)
        run: python -m pyflakes services routes scripts app.py run.py

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check JS modules (strict ESM)
        run: |
          for f in static/js/main.js static/js/drive_sync.js sw.js static/js/modules/*.js; do
            node --check "$f"
          done

      - name: Build frontend bundle (esbuild)
        run: npm ci && npm run build

      - name: Verify committed bundle is fresh
        run: git diff --exit-code -- static/dist

      - name: Verify HTML sync & version consistency
        run: python scripts/sync_version.py check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run e2e smoke tests
        run: npx playwright test
